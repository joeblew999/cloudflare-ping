# The Void app at the root; its docs (VitePress) in docs/; and packages/ (the CLI, the code the
# app, the docs and the CLI share, and the look they share).
#
# The docs are their own package so that the app's package.json doesn't list VitePress: Void
# 1.11.0's `void deploy --platform cloudflare` refuses a package that lists a static site
# generator and has routes/ or pages/, even with `inference.appType: "void"` set as its guide
# says (guide/app-types.md, "Adding a backend to a static site"; only its platform deploy reads
# that setting). Reported: https://github.com/voidzero-dev/void/issues/885.
packages:
  - docs
  - packages/*

catalogMode: prefer

# One version each, for every package ("catalog:" in their package.json).
catalog:
  # MCP (plan 2026-11-20-01): the official server SDK's version 2, and the JSON Schema checker it
  # uses on Workers (its default, Ajv, compiles code at runtime, which Workers forbid).
  "@cfworker/json-schema": 4.1.6
  "@modelcontextprotocol/server": 2.4.0
  # The same SDK's client, for `vp run mcp:check` (scripts/mcp-check.ts): an agent's view of /mcp.
  "@modelcontextprotocol/client": 2.4.0
  # MCP Apps (plan 2026-11-21-02): a tool's page shown in the AI's chat. 2.0.4 is npm's latest
  # (27 October); 2.1.0 isn't tagged latest and adds only WebMCP bridging.
  "@modelcontextprotocol/ext-apps": 2.0.4
  "@types/node": 26.6.6
  # Signing an MCP client in through Void's auth (plan 2026-11-20-01, step 3): Better Auth's own
  # MCP plugin, the OAuth provider it's built on, and Client ID Metadata Documents, at the Better
  # Auth release Void 1.10.0 uses.
  "@better-auth/cimd": 1.7.26
  "@better-auth/mcp": 1.7.26
  "@better-auth/oauth-provider": 1.7.26
  "@void/react": 1.11.0
  better-auth: 1.7.26
  typescript: ^7.0.2
  # The pair Void 1.11.0 writes for a new project (it's built with them): Vite+ 1.7.0 and its core,
  # 8.3.8000. Held at 1.6.0 with Void 1.10.0, which wrote no pair (reported to Void 2026-11-18).
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitepress: 2.0.0-alpha.21
  void: 1.11.0
  vue: 3.5.45
  zod: ^4.6.7

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Void's quickstart: workerd, esbuild and sharp build; better-sqlite3 doesn't (Void uses its own).
allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true
