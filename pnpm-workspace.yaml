# A Vite+ monorepo (Vite+'s `vite:monorepo` template, and its guide/monorepo.md): apps/ (the Void
# app, the docs), packages/ (the CLI, the code they share).
packages:
  - apps/*
  - packages/*

catalogMode: prefer

# One version each, for every package ("catalog:" in their package.json).
catalog:
  # MCP (plan 2026-11-20-01): the official server SDK's version 2, and the JSON Schema checker it
  # uses on Workers (its default, Ajv, compiles code at runtime, which Workers forbid).
  "@cfworker/json-schema": 4.1.6
  "@modelcontextprotocol/server": 2.4.0
  "@types/node": 26.6.6
  # Signing an MCP client in through Void's auth (plan 2026-11-20-01, step 3): Better Auth's own
  # MCP plugin, the OAuth provider it's built on, and Client ID Metadata Documents, at the Better
  # Auth release Void 1.10.0 uses.
  "@better-auth/cimd": 1.7.25
  "@better-auth/mcp": 1.7.25
  "@better-auth/oauth-provider": 1.7.25
  "@void/react": 1.11.0
  better-auth: 1.7.25
  typescript: ^7.0.2
  # Void 1.10.0 writes Vite+ ^1.6.0, which takes Vite+ 1.7.0, whose core must be 8.3.8000 (reported
  # to Void 2026-11-18): both held at 1.6.0 until a Void release writes a pair (still held with
  # Void 1.11.0, 2026-11-20).
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitepress: 2.0.0-alpha.21
  void: 1.11.0
  vue: 3.5.45
  zod: ^4.6.7

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Void's quickstart: workerd, esbuild and sharp build; better-sqlite3 doesn't (Void uses its own).
allowBuilds:
  better-sqlite3: false
  esbuild: true
  sharp: true
  workerd: true
